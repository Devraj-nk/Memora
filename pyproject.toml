[project]
name = "memora"
version = "0.1.0"
description = "Local-first personal knowledge engine with a memory observability layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "networkx>=3.3",
    "rank-bm25>=0.2",
    "ollama>=0.3",
    "httpx>=0.27",
]

[project.scripts]
memora = "memora.cli:main"

[project.optional-dependencies]
# Heavier parsers, only needed once ingestion moves past plain text/markdown/code.
# `unstructured` pulls in poppler/tesseract system binaries for PDF/OCR support.
parsing = [
    "unstructured[all-docs]>=0.15",
    "pytesseract>=0.3",
]
# Swap networkx+SQLite for a real graph DB if the knowledge graph outgrows in-process queries.
graph-db = [
    "neo4j>=5.23",
]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
markers = [
    "slow: exercises a real downloaded model (embedder/reranker/grounding) rather than a mock",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
